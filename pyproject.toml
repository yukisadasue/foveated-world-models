[project]
name = "foveated-world-models"
version = "0.1.0"
description = "LaWAM Stage 1 experiments with timestamp-indexed RoboMIND data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==5.5.4",
  "lightning==2.6.6",
  "timm==1.0.31",
  "wandb==0.31.0",
  "PyYAML==6.0.3",
  "Pillow==12.3.0",
  "numpy==2.2.6",
  "av==15.1.0",
  "pyarrow==24.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
